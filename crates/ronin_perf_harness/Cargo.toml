[package]
name = "ronin_perf_harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Perf Harness: Chat Paint Path sensor+judge tooling (not a product surface)"

[[bin]]
name = "ronin-perf-harness"
path = "src/main.rs"

[dependencies]
pulldown-cmark = "0.13.4"
ronin_core = { path = "../ronin_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = "5.2"
thiserror.workspace = true
time.workspace = true

[dev-dependencies]
tempfile.workspace = true
