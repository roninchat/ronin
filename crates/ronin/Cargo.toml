[package]
name = "ronin"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
arboard.workspace = true
# Prefer ashpd 0.13 for Screenshot portal `target` / AvailableTargets (Window).
# Keep async-io (not tokio) so we do not conflict with gpui's runtime; gpui may
# still pull ashpd 0.11 separately.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screenshot"] }
async-std = "1.13"
gpui = "0.2.2"
image = { version = "0.25", default-features = false, features = ["png"] }
pulldown-cmark = "0.13.4"
ronin_app = { path = "../ronin_app" }
ronin_core = { path = "../ronin_core" }
syntect = "5.2"
thiserror.workspace = true
tracing.workspace = true
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
